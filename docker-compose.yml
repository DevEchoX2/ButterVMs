services:
  buttervms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buttervms-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BUTTERVMS_SECRET_KEY: "replace-with-long-random-string"
      BUTTERVMS_VERSION: "2.0.0"
      BUTTERVMS_VM_PASSWORD: "Celsius001"
      BUTTERVMS_CORS_ORIGIN: "*"
      BUTTERVMS_DB_PATH: "/data/buttervms.db"
      BUTTERVMS_DEBUG: "0"
      BUTTERVMS_SWEEPER_SECONDS: "30"
      BUTTERVMS_VNC_IMAGE: "jlesage/firefox:latest"
      BUTTERVMS_CONTAINER_PREFIX: "buttervms-session"
      BUTTERVMS_PUBLIC_VM_HOST: ""
      BUTTERVMS_PUBLIC_VM_SCHEME: "http"
      BUTTERVMS_PUBLIC_VM_HOST_TEMPLATE: ""
      BUTTERVMS_STANDARD_MINUTES: "120"
      BUTTERVMS_PREMIUM_MINUTES: "480"
      BUTTERVMS_ADMIN_API_TOKEN: "replace-with-private-admin-token"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - buttervms_data:/data

volumes:
  buttervms_data:
